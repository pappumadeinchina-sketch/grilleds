<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing you in… – GrilledS</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo1.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    .auth-success-logo {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 4px 20px rgba(249, 115, 22, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 6px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: rgba(255,255,255,0.65); font-size: 0.95rem; font-weight: 500; }
    .err { color: #f87171; font-size: 0.9rem; }
  </style>
</head>
<body>
  <img src="/assets/logo1.jpg" alt="GrilledS Logo" class="auth-success-logo">
  <div class="spinner"></div>
  <p id="msg">Signing you in…</p>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        document.getElementById('msg').className = 'err';
        document.getElementById('msg').textContent = 'No token received. Redirecting to login…';
        setTimeout(() => window.location.replace('/login'), 2000);
        return;
      }

      // Save to localStorage so app.js picks it up
      localStorage.setItem('pc_token', token);

      // Clean redirect to root — no token in URL
      window.location.replace('/');
    })();
  </script>
</body>
</html>
